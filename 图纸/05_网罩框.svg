<text x="268" y="40" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="3.6500000000000004" fill="#1b1b1b" text-anchor="start" font-weight="bold">加工说明</text>
<text x="268" y="45.8" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 外框 720 × 722.3，比障板四周小 2mm。</text>
<text x="268" y="50.4" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 4 个 Ø316 孔：喇叭法兰 Ø310 从孔中穿出，</text>
<text x="268" y="55" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　孔边与喇叭留 3mm 间隙，不能接触。</text>
<text x="268" y="59.6" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 8 个 Ø10 磁铁位（蓝圈）：在框**背面**钻</text>
<text x="268" y="64.2" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　Ø12 × 深 3.5 浅坑，环氧胶粘 Ø10×3 钕磁铁，</text>
<text x="268" y="68.8" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　磁极方向统一；障板正面同位置拧 M4 铁螺丝。</text>
<text x="268" y="73.4" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　这样网罩正面无螺丝，喷涂后外观干净。</text>
<text x="268" y="78" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 贴布：网布从中心向外拉紧贴在框正面，</text>
<text x="268" y="82.6" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　四边回包 15mm，白乳胶/喷胶固定，吹风机收边。</text>
<text x="268" y="87.2" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 布纹方向保持竖直，斜纹会显歪。</text>
<text x="268" y="91.8" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">• 网罩框外沿做 R3 小圆角，喷同色漆。</text>
