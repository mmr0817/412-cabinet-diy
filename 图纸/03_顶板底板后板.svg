<text x="20" y="211.6" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">　　　插孔板开孔位置可按自己习惯上下移动。</text>
<text x="20" y="216.8" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">顶板：前口与斜置障板相接，需倒 4.51° 斜口，倒角量约 1.4mm（刨或砂盘修）。</text>
<text x="20" y="222" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">底板：脚轮 2 万向装后侧、2 定向装前侧；家用也可只装 4 个橡胶脚垫。</text>
<text x="20" y="227.2" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="2.85" fill="#1b1b1b" text-anchor="start" font-weight="normal">通用：所有板件切好后先试装（含障板、网罩框），确认无误再包皮。</text>
